name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK & Generate Diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🔑 Ensure Debug Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Creating debug.keystore for CI build..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already present."
          fi

      - name: 🔧 Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        id: gradle_build
        run: |
          echo "Starting Gradle build for assembleDebug..."
          set +e
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log
          GRADLE_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ $GRADLE_EXIT_CODE -ne 0 ]; then
            echo "Gradle build failed with exit code $GRADLE_EXIT_CODE"
            exit $GRADLE_EXIT_CODE
          fi
        shell: bash

      - name: 📦 Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ViewPager-UI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 📝 Post Success Summary
        if: success()
        run: |
          APK_SIZE=$(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🎉 Build Berhasil! (APK Ready)

          APK berhasil dikompilasi tanpa kesalahan! Anda dapat mengunduh APK langsung dari bagian **Artifacts** di atas.

          ### 📊 Detail Hasil Build:
          - **File:** \`app-debug.apk\`
          - **Ukuran:** $APK_SIZE
          - **JDK:** Java 21 (Temurin)
          - **Status:** ✅ Passed

          Untuk menginstal di ponsel Android:
          1. Unduh artifact \`ViewPager-UI-debug-apk.zip\` dari run GitHub Actions ini.
          2. Ekstrak file zip untuk mendapatkan \`app-debug.apk\`.
          3. Pasang di perangkat Android (izinkan Install Unknown Apps jika diminta).
          EOF

      - name: 🚨 Capture Build Errors & Diagnostics
        if: failure()
        run: |
          {
            echo "## ❌ Build Gagal - Laporan Diagnostik & Error Log"
            echo "Silakan salin blok keterangan error di bawah ini untuk langsung dianalisis dan diperbaiki:"
            echo ""
            echo "### 📋 Ringkasan Kesalahan (Error Extract):"
            echo '```text'
            if [ -f gradle-build.log ]; then
              grep -E -C 3 '(FAILURE|BUILD FAILED|e: file|Exception|Unresolved reference|Compilation error)' gradle-build.log | head -n 120 || tail -n 60 gradle-build.log
            else
              echo "File gradle-build.log tidak ditemukan."
            fi
            echo '```'
            echo ""
            echo "### 🔍 50 Baris Terakhir dari Build Log:"
            echo '```text'
            if [ -f gradle-build.log ]; then
              tail -n 50 gradle-build.log
            fi
            echo '```'
            echo ""
            echo "### 💡 Panduan Debug Cepat:"
            echo "- **Unresolved reference / Symbol not found:** Periksa import package di file Kotlin yang bersangkutan."
            echo "- **Memory / GC Thrashing:** Pastikan \`gradle.properties\` memiliki \`org.gradle.jvmargs=-Xmx2048m\`."
            echo "- **Keystore error:** Pastikan \`debug.keystore\` ada di root atau step generate keystore berhasil dijalankan."
            echo "- **Java Version Mismatch:** Proyek ini dikonfigurasi untuk Java 21."
          } >> $GITHUB_STEP_SUMMARY

      - name: 📁 Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            gradle-build.log
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
